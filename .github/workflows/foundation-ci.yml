name: Foundation tests
on:
  push:
    branches:
      - foundation/clean-starter-2026
    paths:
      - 'foundation/**'
      - '.github/workflows/foundation-ci.yml'
  pull_request:
    paths:
      - 'foundation/**'
      - '.github/workflows/foundation-ci.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated foundation tests
        working-directory: foundation
        run: PYTHONPATH=src python -m unittest discover -s tests -v
