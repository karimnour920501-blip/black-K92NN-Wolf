name: One-time registry evidence import
on:
  push:
    branches: [integration/registry-v1.0.1]
    paths: ['.github/workflows/registry-evidence-import.yml']
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and extract original evidence
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('BLACKWOLF_UNIFIED_PRODUCT_REGISTRY_v1.0.1.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '0e35b8259a5f357ca89d40c8c03cbceabf9fc366606ac201cb6ae52f061d2abe'
          expected = {'requirements.snapshot.txt':'b4d4321f03cf9b3b22ebedd0dbf5463f872d8560','evidence/pytest.log':'831848709cb896ecac37c2eb83b3d9c590b5d3da','evidence/pytest_report.xml':'0f320ee17de746920a144a73b3a2e75849f2659a'}
          root = pathlib.Path('packages/unified-product-registry')
          with zipfile.ZipFile(archive) as z:
              for name, sha in expected.items():
                  b = z.read(name)
                  assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest() == sha
                  p = root / name
                  assert not p.exists()
                  p.write_bytes(b)
                  print(name, sha)
          PY
      - name: Commit only verified evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/unified-product-registry/requirements.snapshot.txt packages/unified-product-registry/evidence/pytest.log packages/unified-product-registry/evidence/pytest_report.xml
          git commit -m 'feat(registry): batch 03-b2 — add original snapshot and pytest evidence (v1.0.1)'
          git push origin HEAD:refs/heads/integration/registry-v1.0.1
