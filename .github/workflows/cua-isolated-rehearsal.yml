name: Computer Use — local fixture gate
on:
  pull_request:
    paths:
      - 'components/computer-use/**'
      - '.github/workflows/cua-isolated-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-fixture-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: components/computer-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright for browser test
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Run offline tests (including real Chromium)
        run: python -m unittest discover -s tests -v
      - name: Run scripted fixture (no OpenAI API key)
        run: python -m wolf_cua.cli --local-rehearsal --output evidence
      - name: Upload fixture screenshot and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cua-local-fixture-evidence
          path: components/computer-use/evidence/
          if-no-files-found: warn
      - name: Production status remains unverified
        if: always()
        run: echo 'live_api=unverified;production_ready=false;see_docker_job_for_isolation'

  docker-offline-sandbox:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: components/computer-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build isolated Playwright worker
        run: docker build -t wolf-cua-worker:local .
      - name: Run fixture inside networkless read-only Docker worker
        run: python -m wolf_cua.cli --output evidence/docker
      - name: Upload Docker fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cua-docker-fixture-evidence
          path: components/computer-use/evidence/docker/
          if-no-files-found: warn
