name: UER P1 source build and SQLite contracts (NOT release approval)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'tests/**'
      - '.github/workflows/uer-p1-source-build.yml'
      - 'scripts/emit-gates.js'

jobs:
  source-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Restore repository source
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Set up .NET
        id: dotnet
        if: steps.checkout.outcome == 'success'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore UER source
        id: restore
        if: steps.checkout.outcome == 'success' && steps.dotnet.outcome == 'success'
        continue-on-error: true
        run: dotnet restore source/blackwolf-uer-v0.1.1-reliability/src/Uer.Api/Uer.Api.csproj
      - name: Build UER (Release)
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: dotnet build source/blackwolf-uer-v0.1.1-reliability/src/Uer.Api/Uer.Api.csproj --configuration Release --no-restore
      - name: Store-level contracts (not Docker acceptance)
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: dotnet run --project tests/Uer.Api.StoreContracts/Uer.Api.StoreContracts.csproj --configuration Release
      - name: Emit gates.json
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          RESTORE: ${{ steps.dotnet.outcome == 'success' && steps.restore.outcome || steps.dotnet.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp || github.run_started_at }}
        run: node scripts/emit-gates.js
      - name: Upload gate state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-${{ github.run_id }}
          path: gates.json
          if-no-files-found: error
          retention-days: 90
      - name: Report production gate state (not a CI failure)
        if: always()
        run: |
          echo "UER source CI does not grant production approval."
          node <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('gates.json', 'utf8'));
          const productionApproved = state.verified === true &&
            state.production_ready === true &&
            Object.values(state.gates || {}).length > 0 &&
            Object.values(state.gates).every(g =>
              g && g.state === 'verified' &&
              typeof g.evidence === 'string' && g.evidence.trim());
          console.log('production_ready=' + Boolean(productionApproved));
          NODE
      - name: Fail run when a required stage fails or is skipped
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          DOTNET: ${{ steps.dotnet.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          for stage in CHECKOUT DOTNET RESTORE BUILD TESTS; do
            if [ "${!stage}" != "success" ]; then
              echo "::error::${stage} ended with ${!stage}; see gates.json artifact for the truthful gate state."
              exit 1
            fi
          done
