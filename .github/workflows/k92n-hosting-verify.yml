name: K92N source and Docker verification (not production approval)
on:
  pull_request:
    branches: [main]
    paths: ['apps/k92n/**', 'render.yaml', '.github/workflows/k92n-hosting-verify.yml']
  push:
    branches: ['hosting/k92n-render-20261108', 'hardening/k92n-hosting-1.0.1', 'pilot/k92n-prepayment-1.0.2']
    paths: ['apps/k92n/**', 'render.yaml', '.github/workflows/k92n-hosting-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.k92n-ci-nuget-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: apps/k92n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.100'
      - name: Verify pinned build references
        run: python3 tools/verify_supply_chain.py
      - name: Locked NuGet restore
        run: |
          dotnet restore src/K92N.Host/K92N.Host.csproj --locked-mode
          dotnet restore tests/K92N.Tests/K92N.Tests.csproj --locked-mode
      - name: Verify dependency integrity and signatures
        run: python3 tools/verify_supply_chain.py --packages "$NUGET_PACKAGES" --dotnet dotnet
      - name: NuGet advisory audit
        run: |
          dotnet list src/K92N.Host/K92N.Host.csproj package --vulnerable --include-transitive --format json --no-restore > evidence/nuget-audit-ci.json
          python3 tools/verify_supply_chain.py --audit evidence/nuget-audit-ci.json
      - name: C# build
        run: dotnet build src/K92N.Host/K92N.Host.csproj -c Release --no-restore
      - name: C# accounting scenarios
        run: dotnet run --project tests/K92N.Tests/K92N.Tests.csproj -c Release --no-restore
      - name: SQLite and tooling tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Startup guard tests (test doubles)
        run: python3 tools/test_hosting.py
      - name: Compiled host HTTP integration
        run: python3 tools/http_smoke.py
      - name: Pilot HTTP contract checks
        run: python3 tools/pilot_smoke.py
      - name: Exact financial display tests
        run: node --test tests/money.test.mjs
      - name: Locked browser tooling and advisory audit
        run: |
          node --version
          npm ci --ignore-scripts
          npm audit --audit-level=low --json > evidence/npm-audit-ci.json
          python3 tools/verify_supply_chain.py --npm-audit evidence/npm-audit-ci.json
      - name: Install pinned browser builds
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Mobile browser pilot (Chromium and WebKit emulation)
        env:
          K92N_QA_SCREENSHOT: ${{ github.workspace }}/apps/k92n/evidence/qa-{engine}.png
        run: node tests/browser/pilot.cjs
      - name: Recovery acceptance drill
        run: python3 tools/recovery_ci.py
      - name: Build actual Docker image
        run: docker build --file infra/Dockerfile.render --tag k92n-render:test .
      - name: Record built image and OS package inventory
        run: |
          docker image inspect k92n-render:test --format '{{.Id}}' > evidence/container-image-id.txt
          docker run --rm --entrypoint dpkg-query k92n-render:test -W > evidence/container-packages.tsv
      - name: Validate local Compose configuration
        env:
          K92N_OPERATOR_TOKEN: ci-placeholder-for-config-validation-only-123456789
        run: docker compose -f infra/compose.pilot.yaml config --quiet
      - name: Container persistence and HTTP checks
        run: python3 tools/docker_smoke.py
      - name: Local Compose and preflight pilot
        run: python3 tools/compose_smoke.py
      - name: Retain exact CI results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k92n-verification-${{ github.sha }}
          path: |
            apps/k92n/evidence/docker-ci-results.json
            apps/k92n/evidence/http-results.json
            apps/k92n/evidence/recovery-ci-results.json
            apps/k92n/evidence/supply-chain-results.json
            apps/k92n/evidence/dependency-integrity-results.json
            apps/k92n/evidence/nuget-audit-ci.json
            apps/k92n/evidence/nuget-audit-gate.json
            apps/k92n/evidence/container-image-id.txt
            apps/k92n/evidence/container-packages.tsv
            apps/k92n/evidence/pilot-http-results.json
            apps/k92n/evidence/browser-pilot-results.json
            apps/k92n/evidence/npm-audit-ci.json
            apps/k92n/evidence/npm-audit-gate.json
            apps/k92n/evidence/qa-*.png
            apps/k92n/evidence/compose-pilot-results.json
            apps/k92n/evidence/compose-preflight-results.json
          if-no-files-found: error
          retention-days: 14
