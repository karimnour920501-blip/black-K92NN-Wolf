name: Registry gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cryptographic-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2d
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      - run: python -m scripts.enforce_release_gates
