name: k92n-pilot
services:
  init-data:
    image: k92n-pilot:1.0.2
    build:
      context: ..
      dockerfile: infra/Dockerfile.render
    user: '0'
    entrypoint: [bash, -c]
    command: ['chown app:app /data && chmod 700 /data']
    volumes:
      - pilot-data:/data
    restart: 'no'
  web:
    image: k92n-pilot:1.0.2
    build:
      context: ..
      dockerfile: infra/Dockerfile.render
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      K92N_OPERATOR_TOKEN: ${K92N_OPERATOR_TOKEN:?Set a random operator token of at least 32 characters}
      K92N_DATA_MOUNT: /data
      K92N_DATA_DIR: /data/k92n
      PORT: '10000'
    ports:
      - '127.0.0.1:5080:10000'
    volumes:
      - pilot-data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  pilot-data:
